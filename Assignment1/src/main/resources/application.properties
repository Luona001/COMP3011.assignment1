# Application name for Spring Boot
spring.application.name=Assignment1

# OpenAI API key loaded from environment variable (never hardcoded or logged)
# Set via: export OPENAI_API_KEY=your_key_here
openai.api.key=${OPENAI_API_KEY}

# Enable virtual threads for high concurrency (Java 21+)
# Virtual threads are lightweight and can handle >200 concurrent requests efficiently
spring.threads.virtual.enabled=true