<!DOCTYPE html>
<!-- COMP3011 Assignment 1 - Speech-to-Text Web UI -->
<!-- Provides record/stop buttons, status display, and transcription results -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Transcription</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Audio Transcription</h1>

    <button id="startButton" aria-label="Start recording audio">Start Recording</button>
    <button id="stopButton" disabled aria-label="Stop recording audio">Stop Recording</button>

    <p id="status">Status: Not recording</p>

    <h2>Transcription</h2>
    <p id="transcription"></p>
	<p id="loading" style="display:none; color:#FF9800; font-weight:bold;">Uploading audio...</p>
	<p id="error" style="display:none; color:#f44336; font-weight:bold;"></p>
	
	<script src="app.js"></script>

</body>
</html>
